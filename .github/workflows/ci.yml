# CI workflow for the feature/3.0.x line (JDK 21)
#
# Triggers:
#   - push / pull_request on the feature/3.0.x branch
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=false) configured in the POM.
name: CI

on:
  push:
    branches: [feature/3.0.x]
  pull_request:
    branches: [feature/3.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install CJK font for PDF round-trip test
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-droid-fallback
          font_path=/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
          test -f "$font_path"
          echo "EASYPDF_CJK_FONT=$font_path" >> "$GITHUB_ENV"

      - name: Build and verify with JaCoCo coverage gate
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14

      - name: Upload failsafe (integration test) reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports'
          retention-days: 14

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: '**/target/bom.json'
        retention-days: 14
